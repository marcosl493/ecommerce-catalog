version: '3.9'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.ml.enabled=false
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5
  apm-server:
    image: docker.elastic.co/apm/apm-server:8.11.1
    container_name: apm-server
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    command: apm-server -e -c /usr/share/apm-server/apm-server.yml -strict.perms=false -E apm-server.data_streams.enabled=false -E apm-server.precondition.enabled=false
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    ports:
      - "8200:8200"
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_started
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - ELASTICSEARCH_REQUEST_TIMEOUT=30000
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=AAEAAWVsYXN0aWMva2liYW5hL2tpYmFuYS10b2tlbjpZcU5Rd1B0bVR5Mkh6RnFGTGJTV0Z3
    ports:
      - 5601:5601
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16
    container_name: ecommerce-catalog-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=Ecommerce.Catalog
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-logs:/var/log/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c log_destination=csvlog
      -c logging_collector=on
      -c log_directory=/var/log/postgresql
      -c log_filename=postgresql-%Y-%m-%d_%H%M%S.csv
      -c log_statement=all
      -c log_connections=on
      -c log_disconnections=on
      -c log_duration=on
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.1
    container_name: filebeat
    user: root
    depends_on:
      elasticsearch:
        condition: service_started
      postgres:
        condition: service_started
    volumes:
      - ./postgres-logs:/var/log/postgresql:ro
      - ./filebeat.yml:/tmp/filebeat.yml:ro
      - filebeat-data:/usr/share/filebeat/data
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    command: ["sh", "-c", "cp /tmp/filebeat.yml /usr/share/filebeat/filebeat.yml && chmod 600 /usr/share/filebeat/filebeat.yml && filebeat -e"]
    networks:
      - default

  webapi:
    build:
      context: .
      dockerfile: ./src/WebApi/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    depends_on:
      elasticsearch:
        condition: service_started
      postgres:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ELASTICSEARCH_INDEX_NAME=${ELASTICSEARCH_INDEX_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - ELASTIC_APM_SERVER_URLS=http://apm-server:8200
      - ELASTIC_APM_SERVICE_NAME=webapi-ecommerce-catalog
      - ELASTIC_APM_ENVIRONMENT=development
      - ELASTIC_APM_SECRET_TOKEN=
      - ELASTIC_APM_TRANSACTION_SAMPLE_RATE=1.0
      - ConnectionStrings__CatalogDbContext=Server=postgres;Port=5432;Database=Ecommerce.Catalog;
    ports:
      - 8080:8080

volumes:
  esdata:
    driver: local
  pgdata:
    driver: local
  filebeat-data:
    driver: local
